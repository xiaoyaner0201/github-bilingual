name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install ruff==0.15.4
      - name: Python lint
        run: ruff check --select E9,F63,F7,F82 .
      - name: JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n 1 node --check
      - name: Existing Node and Python unit tests
        run: npm test
      - name: Build extension
        run: npm run build
